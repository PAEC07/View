<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino – Filmübersicht</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            font-size: 18px;
        }

        /* FILTER */
        .filter {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #3cb371;
            margin: 20px;
            box-shadow: 0 0 6px rgba(0,0,0,0.12);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .filter-field {
            min-width: 170px;
            display: flex;
            flex-direction: column;
        }

        .filter-field select,
        .filter-field input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #bbb;
            font-size: 18px;
        }

        /* LAYOUT */
        .layout {
            display: flex;
            height: calc(100vh - 200px);
            margin: 0 20px 20px;
            gap: 20px;
        }

        /* FILMLISTE */
        .liste {
            width: 33%;
            background: #ffffff;
            border-radius: 8px;
            border-left: 5px solid #3cb371;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 0 6px rgba(0,0,0,0.12);
        }

        .liste h2 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        .liste ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .liste li {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 2px solid #3cb371;
            background: #ffffff;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
        }

        .liste li:hover {
            background: #f0f0f0;
        }

        .liste li.aktiv {
            background: #e6ffe6;
            border-color: #2f9d63;
        }

        /* INHALT + BUCHUNG */
        .inhalt, .buchen-box {
            flex: 1;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            border-left: 5px solid #3cb371;
            box-shadow: 0 0 6px rgba(0,0,0,0.12);
            display: none;
            position: relative;
        }

        /* INFO-FELD – jetzt WEISS ohne grün */
        .film-info {
            margin-top: 25px;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 22px;
            line-height: 1.7;
        }

        .film-info div {
            margin-bottom: 12px;
        }

        /* BUTTONS */
        .buttons-row {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            font-size: 20px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .btn-green {
            background: #3cb371;
        }

        .btn-grey {
            background: #777;
        }

        .btn:hover {
            filter: brightness(90%);
        }
    </style>
</head>
<body>

<!-- FILTER -->
<section class="filter">
    <h3 style="margin-top:0;">Filtern nach</h3>

    <div class="filter-row">
        <div class="filter-field">
            <label>Format</label>
            <select>
                <option value="">Alle</option>
                <option value="2d">2D</option>
                <option value="3d">3D</option>
            </select>
        </div>

        <div class="filter-field">
            <label>FSK</label>
            <select>
                <option value="">Alle</option>
                <option>6</option>
                <option>12</option>
                <option>16</option>
                <option>18</option>
            </select>
        </div>

        <div class="filter-field">
            <label>Bereich</label>
            <select>
                <option value="">Alle</option>
                <option>Parkett</option>
                <option>Loge</option>
            </select>
        </div>

        <div class="filter-field">
            <label>Datum</label>
            <input type="date">
        </div>
    </div>
</section>

<div class="layout">

    <!-- FILMLISTE -->
    <aside class="liste">
        <h2>Filme</h2>
        <ul>
            <li data-titel="Film 1" data-beschreibung="Spannender Actionfilm." data-fsk="16" data-format="3D" data-preis="12.99">Film 1</li>
            <li data-titel="Film 2" data-beschreibung="Romantische Komödie." data-fsk="12" data-format="2D" data-preis="9.99">Film 2</li>
            <li data-titel="Film 3" data-beschreibung="Science-Fiction Abenteuer." data-fsk="6" data-format="3D" data-preis="14.50">Film 3</li>
        </ul>
    </aside>

    <!-- INHALT -->
    <section class="inhalt" id="inhaltBox">
        <h2 id="inhaltTitel">Inhalt</h2>
        <p id="inhaltText" style="font-size:20px;">Wähle links einen Film aus.</p>

        <!-- Info-Feld (jetzt weiß!) -->
        <div class="film-info" id="filmInfo" style="display:none;">
            <div><strong>FSK:</strong> <span id="infoFsk"></span></div>
            <div><strong>Kategorie:</strong> <span id="infoFormat"></span></div>
            <div><strong>Preis pro Karte:</strong> <span id="infoPreis"></span> €</div>
        </div>

        <div class="buttons-row">
            <button class="btn btn-green" id="buchenBtn">Buchen</button>
        </div>
    </section>

    <!-- BUCHUNG -->
    <section class="buchen-box" id="buchenBox">
        <h2>Buchung</h2>
        <p style="font-size:20px;">Hier kommt später das Buchungsformular hin.</p>

        <div class="buttons-row">
            <button class="btn btn-grey" id="zurueckBtn">Zurück</button>
            <button class="btn btn-green">Bezahlen</button>
        </div>
    </section>

</div>

<script>
    const filme = document.querySelectorAll('.liste li');
    const inhaltBox = document.getElementById('inhaltBox');
    const buchenBox = document.getElementById('buchenBox');
    const inhaltTitel = document.getElementById('inhaltTitel');
    const inhaltText = document.getElementById('inhaltText');
    const infoBox = document.getElementById('filmInfo');
    const infoFsk = document.getElementById('infoFsk');
    const infoFormat = document.getElementById('infoFormat');
    const infoPreis = document.getElementById('infoPreis');

    const buchenBtn = document.getElementById('buchenBtn');
    const zurueckBtn = document.getElementById('zurueckBtn');

    filme.forEach(li => {
        li.addEventListener('click', () => {
            filme.forEach(e => e.classList.remove('aktiv'));
            li.classList.add('aktiv');

            inhaltTitel.textContent = li.dataset.titel;
            inhaltText.textContent = li.dataset.beschreibung;

            infoFsk.textContent = li.dataset.fsk;
            infoFormat.textContent = li.dataset.format;
            infoPreis.textContent = li.dataset.preis;

            infoBox.style.display = "block";

            buchenBox.style.display = 'none';
            inhaltBox.style.display = 'block';
        });
    });

    buchenBtn.addEventListener('click', () => {
        inhaltBox.style.display = 'none';
        buchenBox.style.display = 'block';
    });

    zurueckBtn.addEventListener('click', () => {
        buchenBox.style.display = 'none';
        inhaltBox.style.display = 'block';
    });
</script>

</body>
</html>
