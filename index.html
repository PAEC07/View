<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino – Filmübersicht</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            font-size: 18px;
        }

        /* FILTER */
        .filter {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #3cb371;
            margin: 20px;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.12);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .filter-field {
            min-width: 170px;
            display: flex;
            flex-direction: column;
        }

        .filter-field select,
        .filter-field input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #bbb;
            font-size: 18px;
        }

        /* LAYOUT */
        .layout {
            display: flex;
            height: calc(100vh - 200px);
            margin: 0 20px 20px;
            gap: 20px;
        }

        /* FILMLISTE */
        .liste {
            width: 33%;
            background: #ffffff;
            border-radius: 8px;
            border-left: 5px solid #3cb371;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.12);
        }

        .liste h2 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }

        .liste ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .liste li {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 2px solid #3cb371;
            background: #ffffff;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
        }

        .liste li:hover {
            background: #f0f0f0;
        }

        .liste li.aktiv {
            background: #e6ffe6;
            border-color: #2f9d63;
        }

        /* INHALT + BUCHUNG */
        .inhalt,
        .buchen-box {
            flex: 1;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            border-left: 5px solid #3cb371;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.12);
            display: none;
            position: relative;
        }

        /* INFO-FELD Inhalt */
        .film-info {
            margin-top: 25px;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 22px;
            line-height: 1.7;
        }

        .film-info div {
            margin-bottom: 12px;
        }

        /* BUTTONS unten */
        .buchen-box,
        .inhalt {
            display: flex;
            flex-direction: column;
        }

        .buttons-row {
            margin-top: auto;
            /* Buttons rutschen automatisch nach unten */
            padding-top: 20px;
            padding-bottom: 10px;
            display: flex;
            gap: 20px;
        }


        .btn {
            padding: 12px 20px;
            border: none;
            font-size: 20px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .btn-green {
            background: #3cb371;
        }

        .btn-grey {
            background: #777;
        }

        .btn:hover {
            filter: brightness(90%);
        }

        /* BUCHUNGSGRID (dein Mockup) */
        .buchung-rahmen {
            margin-top: 25px;
            border: 3px solid #3cb371;
            /* grüner Rahmen wie im Mockup */
            border-radius: 10px;
            padding: 20px;
        }

        .buchung-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            /* Preis | Karten */
            grid-template-rows: auto auto;
            gap: 20px;
            background: #f7f7f7;
            /* leicht graue Tabelle */
            padding: 20px;
            border-radius: 6px;
        }

        .buchung-col {
            font-size: 20px;
        }

        .buchung-col h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .preis-zeile {
            margin-bottom: 10px;
        }

        .preis-zeile span {
            float: right;
        }

        .karten-feld {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .karten-feld label {
            margin-bottom: 4px;
        }

        .karten-feld select {
            border: 2px solid red;
            /* rote Felder wie im Mockup */
            border-radius: 6px;
            padding: 6px;
            font-size: 18px;
        }

        .erm-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }

        /* türkiser Bereich mit den drei Ermäßigungsfeldern */
        .erm-bereich {
            border: 3px solid #00c0c0;
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 5px;
        }

        .erm-bereich.hidden {
            display: none;
        }

        /* SUMME-ZEILE */
        .summe-row {
            grid-column: 1 / span 2;
            /* über beide Spalten */
            margin-top: 10px;
            padding-top: 12px;
            border-top: 2px solid #ccc;
            font-size: 22px;
        }

        .summe-row strong {
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <!-- FILTER -->
    <section class="filter">
        <h3 style="margin-top:0;">Filtern nach</h3>

        <div class="filter-row">
            <div class="filter-field">
                <label>Format</label>
                <select>
                    <option value="">Alle</option>
                    <option value="2d">2D</option>
                    <option value="3d">3D</option>
                </select>
            </div>

            <div class="filter-field">
                <label>FSK</label>
                <select>
                    <option value="">Alle</option>
                    <option>6</option>
                    <option>12</option>
                    <option>16</option>
                    <option>18</option>
                </select>
            </div>

            <div class="filter-field">
                <label>Bereich</label>
                <select>
                    <option value="">Alle</option>
                    <option>Parkett</option>
                    <option>Loge</option>
                </select>
            </div>

            <div class="filter-field">
                <label>Datum</label>
                <input type="date">
            </div>
        </div>
    </section>

    <div class="layout">

        <!-- FILMLISTE -->
        <aside class="liste">
            <h2>Filme</h2>
            <ul>
                <li data-titel="Film 1" data-beschreibung="Spannender Actionfilm." data-fsk="16" data-format="3D"
                    data-preis="12.99">Film 1</li>
                <li data-titel="Film 2" data-beschreibung="Romantische Komödie." data-fsk="12" data-format="2D"
                    data-preis="9.99">Film 2</li>
                <li data-titel="Film 3" data-beschreibung="Science-Fiction Abenteuer." data-fsk="6" data-format="3D"
                    data-preis="14.50">Film 3</li>
            </ul>
        </aside>

        <!-- INHALT -->
        <section class="inhalt" id="inhaltBox">
            <h2 id="inhaltTitel">Inhalt</h2>
            <p id="inhaltText" style="font-size:20px;">Wähle links einen Film aus.</p>

            <div class="film-info" id="filmInfoDetails" style="display:none;">
                <div><strong>FSK:</strong> <span id="infoFsk"></span></div>
                <div><strong>Kategorie:</strong> <span id="infoFormat"></span></div>
                <div><strong>Preis pro Karte:</strong> <span id="infoPreis"></span> €</div>
            </div>

            <div class="buttons-row">
                <button class="btn btn-green" id="buchenBtn">Buchen</button>
            </div>
        </section>

        <!-- BUCHUNG -->
        <section class="buchen-box" id="buchenBox">
            <h2>Buchung</h2>
            <p style="font-size:20px;">Wähle die Anzahl der Karten und bestätige deine Buchung.</p>

            <div class="buchung-rahmen">
                <div class="buchung-grid">
                    <!-- linke Spalte: Preise -->
                    <div class="buchung-col" id="preisSpalte">
                        <h3>Preis</h3>
                        <div class="preis-zeile">
                            Erwachsene
                            <span id="preisErwachsene">0,00 €</span>
                        </div>
                        <div class="preis-zeile">
                            Studenten
                            <span>-20 %</span>
                        </div>
                        <div class="preis-zeile">
                            Senioren
                            <span>-15 %</span>
                        </div>
                        <div class="preis-zeile">
                            Kinder
                            <span>-30 %</span>
                        </div>
                    </div>

                    <!-- rechte Spalte: Karten -->
                    <div class="buchung-col">
                        <h3>Karten</h3>

                        <div class="karten-feld">
                            <label for="anzahlVoll">Anzahl (Erwachsene)</label>
                            <select id="anzahlVoll">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                        </div>

                        <div class="erm-box">
                            <input type="checkbox" id="ermCheck">
                            <label for="ermCheck">Ermäßigungen</label>
                        </div>

                        <div id="ermBereich" class="erm-bereich hidden">
                            <div class="karten-feld">
                                <label for="anzahlStudent">Studenten</label>
                                <select id="anzahlStudent">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </div>

                            <div class="karten-feld">
                                <label for="anzahlSenior">Senioren</label>
                                <select id="anzahlSenior">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </div>

                            <div class="karten-feld">
                                <label for="anzahlKinder">Kinder</label>
                                <select id="anzahlKinder">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Summe -->
                    <div class="summe-row">
                        <strong>Summe:</strong> <span id="summeAnzeige">0,00 €</span>
                    </div>
                </div>
            </div>

            <div class="buttons-row">
                <button class="btn btn-grey" id="zurueckBtn">Zurück</button>
                <button class="btn btn-green">Bezahlen</button>
            </div>
        </section>

    </div>

    <script>
        const filme = document.querySelectorAll('.liste li');
        const inhaltBox = document.getElementById('inhaltBox');
        const buchenBox = document.getElementById('buchenBox');
        const inhaltTitel = document.getElementById('inhaltTitel');
        const inhaltText = document.getElementById('inhaltText');

        const infoBox = document.getElementById('filmInfoDetails');
        const infoFsk = document.getElementById('infoFsk');
        const infoFormat = document.getElementById('infoFormat');
        const infoPreis = document.getElementById('infoPreis');

        const buchenBtn = document.getElementById('buchenBtn');
        const zurueckBtn = document.getElementById('zurueckBtn');

        // Buchungs-Elemente
        const preisErwachsene = document.getElementById('preisErwachsene');
        const summeAnzeige = document.getElementById('summeAnzeige');

        const selectVoll = document.getElementById('anzahlVoll');
        const selectStud = document.getElementById('anzahlStudent');
        const selectSen = document.getElementById('anzahlSenior');
        const selectKind = document.getElementById('anzahlKinder');

        const ermCheck = document.getElementById('ermCheck');
        const ermBereich = document.getElementById('ermBereich');

        let aktuellerFilm = null;
        let grundpreis = 0; // Preis pro Erwachsenenticket

        const RABATT_STUDENT = 0.20;
        const RABATT_SENIOR = 0.15;
        const RABATT_KIND = 0.30;

        function formatEuro(wert) {
            return wert.toFixed(2).replace('.', ',') + " €";
        }

        function aktualisiereSumme() {
            const voll = parseInt(selectVoll.value) || 0;
            const stud = ermCheck.checked ? (parseInt(selectStud.value) || 0) : 0;
            const sen = ermCheck.checked ? (parseInt(selectSen.value) || 0) : 0;
            const kind = ermCheck.checked ? (parseInt(selectKind.value) || 0) : 0;

            let summe = 0;
            summe += voll * grundpreis;
            summe += stud * grundpreis * (1 - RABATT_STUDENT);
            summe += sen * grundpreis * (1 - RABATT_SENIOR);
            summe += kind * grundpreis * (1 - RABATT_KIND);

            summeAnzeige.textContent = formatEuro(summe);
        }

        filme.forEach(li => {
            li.addEventListener('click', () => {
                filme.forEach(e => e.classList.remove('aktiv'));
                li.classList.add('aktiv');

                aktuellerFilm = li;

                inhaltTitel.textContent = li.dataset.titel;
                inhaltText.textContent = li.dataset.beschreibung;

                infoFsk.textContent = li.dataset.fsk;
                infoFormat.textContent = li.dataset.format;
                infoPreis.textContent = li.dataset.preis;
                infoBox.style.display = "block";

                grundpreis = parseFloat(li.dataset.preis) || 0;
                preisErwachsene.textContent = formatEuro(grundpreis);
                aktualisiereSumme();

                buchenBox.style.display = 'none';
                inhaltBox.style.display = 'block';
            });
        });

        buchenBtn.addEventListener('click', () => {
            if (!aktuellerFilm) {
                alert("Bitte zuerst einen Film auswählen.");
                return;
            }
            inhaltBox.style.display = 'none';
            buchenBox.style.display = 'block';
        });

        zurueckBtn.addEventListener('click', () => {
            buchenBox.style.display = 'none';
            inhaltBox.style.display = 'block';
        });

        ermCheck.addEventListener('change', () => {
            const aktiv = ermCheck.checked;
            ermBereich.classList.toggle('hidden', !aktiv);

            if (!aktiv) {
                selectStud.value = "0";
                selectSen.value = "0";
                selectKind.value = "0";
            }
            aktualisiereSumme();
        });

        [selectVoll, selectStud, selectSen, selectKind].forEach(sel => {
            sel.addEventListener('change', aktualisiereSumme);
        });
    </script>

</body>

</html>
